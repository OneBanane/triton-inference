[project]
name = "triton-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "hydra-core>=1.3.7",
    "pydantic>=2.13.5",
    "tritonclient[grpc]>=2.73.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
triton-inference = "triton_inference:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
